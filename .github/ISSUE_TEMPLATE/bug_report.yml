name: Bug report
description: Something in Slab Hunt looks wrong or doesn't work. NOT for security problems (see SECURITY.md).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Security problem?** Don't post it here. Report it privately in the game (Profile → Bug bounty) or DM @slabhuntfun on X. See SECURITY.md.
        Accepted bug reports can earn a $SLAB reward, decided case by case.
  - type: input
    id: summary
    attributes: { label: What went wrong?, placeholder: Short summary }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. Open...\n2. Tap...\n3. See..." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What did you expect instead? }
  - type: input
    id: device
    attributes: { label: Device and browser, placeholder: "e.g. Pixel 8, Chrome 130 / Phantom in-app browser" }
  - type: input
    id: username
    attributes: { label: Your Slab Hunt username (optional, for the reward) }
